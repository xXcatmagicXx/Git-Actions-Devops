<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Document</title>
    </head>

    <body>
        <div class="card">
            <div style="box-shadow: black 10px 6px 10px; width: 200px; height: 200px; border-radius: 50%; justify-self: center;">
                <img src="https://i.pinimg.com/736x/8f/85/4e/8f854e4b78ecc4c356b0ae6f940e796d.jpg" alt="profile img" class="profile-img">
            </div>
            <h2>תומר חמצוב</h2>
            <p class="title">anime ig..</p>
            <p class="qoute">im not gonna survive</p>
            <a href="#" class="whatsapp-btn">This button is a lie</a>


        </div>
        <script>
            function getAngleDegrees(pointX, pointY, centerX, centerY) {
                const deltaX = pointX - centerX;
                const deltaY = pointY - centerY;

                const angleRadians = Math.atan2(deltaY, deltaX);

                let angleDegrees = angleRadians * 180 / Math.PI;

                if (angleDegrees < 0) {
                    angleDegrees += 360;
                }

                return angleDegrees;
            }
            document.addEventListener('mousemove', function(event) {
                const xCoord = event.clientX;
                const yCoord = event.clientY;
                const width = document.body.clientWidth;
                const height = document.body.clientHeight;
                let img = document.querySelector(".profile-img");
                img.style.cssText += `transform: rotateZ(${getAngleDegrees(xCoord, yCoord, width/2, height/2-80)}deg);`;
                
            });
        </script>
    </body>

</html>
